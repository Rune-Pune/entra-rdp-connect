name: Release

# Bygger binæren fra kildekoden og publiserer den når en versjon merkes:
#   git tag v1.0.0 && git push origin v1.0.0
# Kun tagger — ikke manuell kjøring, siden releasen navngis etter taggen
# (en manuell kjøring fra main ville laget en release som het «main»).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test -c Release

      - name: Publish self-contained single-file (linux-x64)
        run: |
          dotnet publish src/EntraRdpConnect.App \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -p:Version=${GITHUB_REF_NAME#v} \
            -o publish

      - name: Sjekksum
        run: |
          cd publish
          sha256sum entra-rdp-connect > entra-rdp-connect.sha256
          cat entra-rdp-connect.sha256

      - name: Opprett release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Selvstendig binær for Linux x64 — ingen .NET-runtime kreves. Se README for systemavhengigheter (uwg-quick, xfreerdp3, firefox, script)." \
            publish/entra-rdp-connect \
            publish/entra-rdp-connect.sha256
