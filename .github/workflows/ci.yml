name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # -warnaserror: en ny analysatoradvarsel skal stoppe en PR, ikke bli oversett i loggen.
      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test --no-build -c Release

      # Catches single-file regressions before a tag is pushed — that is the form users download.
      - name: Publish (smoke test)
        run: |
          dotnet publish src/EntraRdpConnect.App \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -o publish-smoketest
          test -x publish-smoketest/entra-rdp-connect
