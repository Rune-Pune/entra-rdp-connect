version: 2
updates:
  # NuGet packages. Grouped into one pull request per week: Avalonia and
  # CommunityToolkit ship frequently, and a separate PR per package would bury
  # the ones that matter.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      all-dependencies:
        patterns: ['*']

  # The pinned action versions in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
